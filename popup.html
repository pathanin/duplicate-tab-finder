<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Duplicate Tab Finder</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="top">
        <img src="icons/icon48.png" alt="" class="logo">
        <div class="title">
            <h1>Duplicate Tabs</h1>
            <p id="summary">Looking…</p>
        </div>
        <div class="tally" aria-hidden="true"><strong id="tally">0</strong><span>to close</span></div>
    </header>

    <section class="rules" aria-label="Matching rules">
        <span class="rules-label">Ignore</span>
        <label class="rule" title="page#intro and page#setup count as the same">
            <input type="checkbox" role="switch" id="ignoreHash" class="switch" aria-label="Ignore #fragments">
            <code>#fragments</code>
            <span class="delta" id="ignoreHashDelta"></span>
        </label>
        <label class="rule" title="utm_*, fbclid, gclid and other tracking junk">
            <input type="checkbox" role="switch" id="ignoreTracking" class="switch" aria-label="Ignore tracking params">
            tracking params
            <span class="delta" id="ignoreTrackingDelta"></span>
        </label>
        <div id="peek" class="peek" role="status" aria-live="polite"></div>
    </section>

    <main>
        <ul id="groups" class="groups"></ul>
        <div id="empty" class="empty" hidden>
            <img src="icons/icon128.png" alt="">
            <p class="empty-title">No duplicates</p>
            <p id="emptyHint" class="empty-hint">Every open tab is unique.</p>
        </div>
    </main>

    <footer class="bottom">
        <div id="toast" class="toast" role="status" aria-live="polite" hidden>
            <span id="toastText"></span>
            <button id="undoBtn" class="link-btn" type="button">Undo</button>
        </div>
        <button id="closeAll" class="primary" type="button" disabled>Close duplicates</button>
    </footer>

    <script src="dupes.js"></script>
    <script src="popup.js"></script>
</body>
</html>
